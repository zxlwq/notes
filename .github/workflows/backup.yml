name: 自动备份笔记到云盘

on:
  schedule:
    - cron: '0 0 * * *' # 每天0点（UTC）自动执行一次
  workflow_dispatch: # 允许手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare Pages 备份接口
        id: backup
        env:
          BACKUP_TOKEN: ${{ secrets.TOKEN }}
        run: |
          backup_one() {
            local name="$1"
            local path="$2"
            local outfile="$3"
            set +e
            response=$(curl -sS -w "%{http_code}" -o "$outfile" -X POST "https://notes.zxlwq.dpdns.org${path}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${BACKUP_TOKEN}" \
              -d '{}')
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ] || [ "$response" != "200" ] || ! jq -e '.success == true' "$outfile" >/dev/null; then
              echo "::error::${name} 备份失败（curl=$curl_status，HTTP=$response）"
              echo "响应内容如下："
              cat "$outfile"
              return 1
            fi
            echo "${name} 备份成功：$(cat "$outfile")"
            return 0
          }

          failed=0
          backup_one "WebDAV" "/api/backup" result-webdav.txt || failed=1
          backup_one "R2" "/api/r2" result-r2.txt || failed=1
          backup_one "Gist" "/api/gist" result-gist.txt || failed=1
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "HTTP_RESPONSE=200" >> "$GITHUB_ENV"

      - name: 检查备份是否成功并发送 TG 通知
        if: env.HTTP_RESPONSE == '200'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          MESSAGE="✅ *笔记自动备份成功！*\n🗂️ 时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')\n🌐 来源：notes.zxlwq.dpdns.org\n📦 WebDAV / Cloudflare R2 / GitHub Gist"
          curl -s -X POST https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage \
            -d chat_id=${TG_USER_ID} \
            -d text="$MESSAGE" \
            -d parse_mode=Markdown
