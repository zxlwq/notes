version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=notes
      - POSTGRES_USER=notes
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped

  notes:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PASSWORD=${PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://notes:${POSTGRES_PASSWORD}@postgres:5432/notes
      - WEBDAV_URL=${WEBDAV_URL}
      - WEBDAV_USER=${WEBDAV_USER}
      - WEBDAV_PASS=${WEBDAV_PASS}
      - ACCOUNT_ID=${ACCOUNT_ID}
      - ACCESS_KEY_ID=${ACCESS_KEY_ID}
      - SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY}
      - GIT_TOKEN=${GIT_TOKEN}
      # AI（可选，完整列表见 .env.example）
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_RATE_LIMIT_MAX=${AI_RATE_LIMIT_MAX}
      - AI_RATE_LIMIT_WINDOW_SEC=${AI_RATE_LIMIT_WINDOW_SEC}
      - AI_MAX_INPUT_CHARS=${AI_MAX_INPUT_CHARS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL_NAME=${ARK_MODEL_NAME}
      - KILO_API_KEY=${KILO_API_KEY}
      - KILO_BASE_URL=${KILO_BASE_URL}
      - KILO_MODEL_NAME=${KILO_MODEL_NAME}
      - CF_API_KEY=${CF_API_KEY}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_MODEL_NAME=${CF_MODEL_NAME}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL}
      - ZHIPU_MODEL_NAME=${ZHIPU_MODEL_NAME}
      - GH_API_KEY=${GH_API_KEY}
      - GH_BASE_URL=${GH_BASE_URL}
      - GH_MODEL_NAME=${GH_MODEL_NAME}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
